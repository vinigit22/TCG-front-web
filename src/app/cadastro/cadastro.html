<section class="cadastro-page">
  <div class="cadastro-container">
    <h1 class="cadastro-titulo">CADASTRO DE LOJA</h1>
    <form class="cadastro-form">
      <label for="nome">Nome da Loja</label>
      <input type="text" id="nome" placeholder="Ex: Card House">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="contato@loja.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••">

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(11) 99999-9999">

      <label for="descricao">Descrição</label>
      <textarea id="descricao" rows="3" placeholder="Conte sobre sua loja..."></textarea>

      <button type="submit" class="btn-cadastrar">CADASTRAR</button>
    </form>
    <p class="cadastro-link">Já tem conta? <a href="/login">Entrar</a></p>
  </div>
</section>
